<style>
@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/cairo-arabic-400.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;}
@font-face{font-family:'Cairo';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/cairo-arabic-600.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;}

@font-face{font-family:'Cairo';font-style:normal;font-weight:900;font-display:swap;src:url('fonts/cairo-arabic-900.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;}
@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/cairo-latin-400.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/cairo-latin-700.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Cairo';font-style:normal;font-weight:900;font-display:swap;src:url('fonts/cairo-latin-900.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Segoe UI',sans-serif;}
:root{
  --ink:#060a11; --ash:#0d1522; --steel:#16223a;
  --gold:#e8bc6b; --gold2:#ffe6b0; --gold3:#b98a34;
  --em:#3ee0b6; --sky:#5ec8ff;
  --txt:#f4f8ff; --soft:#b7c6dd; --dim:#8496b0;
  --hd:clamp(62px,8.2vh,104px); --ft:clamp(52px,6.6vh,86px);
  --rail:clamp(146px,13vw,214px);
}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:var(--ink);color:var(--txt);-webkit-font-smoothing:antialiased;}

/* ============ خلفية ============ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(120% 90% at 82% -10%,#1d3358 0%,transparent 55%),
   radial-gradient(90% 80% at 8% 110%,#123428 0%,transparent 60%),
   linear-gradient(160deg,#0b1322 0%,#070c15 55%,#05080e 100%);}
.bg::before{content:'';position:absolute;inset:0;opacity:.35;
  background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.05) 1px,transparent 1.4px) 0 0/52px 52px,
             radial-gradient(circle at 70% 75%,rgba(232,188,107,.07) 1px,transparent 1.4px) 0 0/74px 74px;}
.bg::after{content:'';position:absolute;inset:-30%;opacity:.5;
  background:linear-gradient(100deg,transparent 44%,rgba(232,188,107,.10) 50%,transparent 56%);
  animation:sweep 11s linear infinite;}
@keyframes sweep{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
.glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px);}
.glow.g1{top:-14vh;right:-8vw;width:46vw;height:46vw;background:rgba(60,120,220,.22);}
.glow.g2{bottom:-18vh;left:calc(var(--rail) - 6vw);width:40vw;height:40vw;background:rgba(62,224,182,.13);}
.wm{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:.10;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'520'%20height%3D'360'%3E%3Ctext%20x%3D'260'%20y%3D'170'%20font-size%3D'34'%20font-family%3D'Arial,%20sans-serif'%20font-weight%3D'700'%20fill%3D'%23e8bc6b'%20text-anchor%3D'middle'%20transform%3D'rotate(-24%20260%20170)'%3E0548471318%3C%2Ftext%3E%3C%2Fsvg%3E") repeat;
  background-size:520px 360px;}

/* ============ الترويسة ============ */
.hd{position:fixed;top:0;left:0;right:0;height:var(--hd);z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(16px,2.6vw,44px);gap:20px;
  background:linear-gradient(180deg,rgba(6,10,17,.92),rgba(6,10,17,.55) 70%,transparent);
  border-bottom:1px solid rgba(232,188,107,.14);}
.logo{display:flex;align-items:center;gap:clamp(9px,1vw,16px);}
.logo .tile{width:clamp(40px,4.2vh,58px);height:clamp(40px,4.2vh,58px);border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--gold2),var(--gold3));color:#2a1c05;
  box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);}
.logo .tile svg{width:60%;height:60%;}
.logo .nm b{display:block;font-size:clamp(17px,1.75vw,30px);font-weight:900;line-height:1.15;letter-spacing:.4px;}
.logo .nm small{display:block;color:var(--gold);font-weight:700;letter-spacing:clamp(2px,.35vw,5px);font-size:clamp(9px,.72vw,13px);}
.hc{display:flex;align-items:center;gap:clamp(7px,.8vw,13px);flex-wrap:wrap;justify-content:flex-end;}
.hchip{display:flex;align-items:center;gap:8px;padding:.5em 1em;border-radius:99px;text-decoration:none;
  color:var(--txt);font-weight:700;font-size:clamp(12px,1.05vw,19px);letter-spacing:.3px;
  border:1px solid rgba(232,188,107,.4);background:rgba(232,188,107,.10);direction:ltr;
  transition:.3s;white-space:nowrap;}
.hchip.wa{border-color:rgba(62,224,182,.5);background:rgba(62,224,182,.12);}
.hchip:hover{background:rgba(232,188,107,.22);transform:translateY(-2px);}
.hchip img{width:1.15em;height:1.15em;}
.hchip .lbl{font-size:.78em;color:var(--soft);letter-spacing:0;}

/* ============ عمود العلامات التجارية ============ */
#rail{position:fixed;left:0;top:var(--hd);bottom:var(--ft);width:var(--rail);z-index:25;
  padding:clamp(10px,1.8vh,22px) clamp(9px,.9vw,16px) clamp(10px,1.8vh,20px) clamp(12px,1.2vw,20px);
  display:flex;flex-direction:column;gap:clamp(6px,1.1vh,14px);
  border-right:1px solid rgba(232,188,107,.18);
  background:linear-gradient(270deg,rgba(232,188,107,.05),rgba(6,10,17,.35));}
#rail .rt{color:var(--gold);font-weight:700;letter-spacing:3px;font-size:clamp(10px,.82vw,14px);}
#rail .rnum{display:flex;align-items:center;gap:9px;}
#rail .rnum b{font-size:clamp(34px,3.6vw,60px);font-weight:900;line-height:.9;
  background:linear-gradient(160deg,var(--gold2),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;}
#rail .rnum span{font-size:clamp(10px,.85vw,14px);font-weight:700;color:var(--soft);line-height:1.35;}
#rail .rsep{height:1px;background:linear-gradient(90deg,transparent,rgba(232,188,107,.45),transparent);}
#rail .rlist{display:flex;flex-direction:column;gap:clamp(3px,.55vh,7px);flex:1;min-height:0;}
.bi{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:.46em .7em;border-radius:11px;border:1px solid transparent;
  color:var(--dim);transition:.35s;}
.bi .bn{font-size:clamp(12.5px,1.08vw,20px);font-weight:700;white-space:nowrap;}
.bi .bc{font-size:clamp(9px,.74vw,13px);font-weight:700;opacity:.75;
  background:rgba(255,255,255,.07);border-radius:99px;padding:.1em .55em;min-width:1.7em;text-align:center;}
.bi.on{color:#1c1305;background:linear-gradient(140deg,var(--gold2),var(--gold));border-color:var(--gold2);
  box-shadow:0 8px 20px rgba(232,188,107,.28);}
.bi.on .bc{background:rgba(0,0,0,.18);opacity:1;}
#rail .rfoot{color:var(--dim);font-size:clamp(9px,.76vw,13px);font-weight:700;letter-spacing:1px;text-align:center;
  border-top:1px solid rgba(255,255,255,.10);padding-top:clamp(5px,.9vh,10px);}

/* ============ الشاشة / الشرائح ============ */
#stage{position:fixed;top:var(--hd);bottom:var(--ft);left:var(--rail);right:0;z-index:10;}
.sf{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .75s ease,visibility .75s;
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(clamp(250px,23vw,520px),1fr);
  gap:clamp(14px,2vw,38px);padding:clamp(8px,1.7vh,26px) clamp(14px,2.4vw,46px);}
.sf.on{opacity:1;visibility:visible;}
.sf.ad{grid-template-columns:1fr;place-items:center;}

/* ---- العمود: الصورة ---- */
.ci{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(7px,1.2vh,15px);min-width:0;min-height:0;}
.ph{position:relative;min-height:0;overflow:hidden;border-radius:clamp(13px,1.5vw,26px);
  background:#0a1120;box-shadow:0 34px 74px rgba(0,0,0,.6),0 0 0 1px rgba(232,188,107,.30),inset 0 0 0 1px rgba(255,255,255,.06);}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .75s ease,transform 7s linear;}
.ph img.on{opacity:1;transform:scale(1.07);}
.ph .vig{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,8,14,.55) 0%,transparent 26%,transparent 62%,rgba(4,8,14,.72) 100%);}
.corner{position:absolute;width:clamp(16px,1.5vw,28px);height:clamp(16px,1.5vw,28px);border:3px solid rgba(232,188,107,.92);z-index:6;pointer-events:none;}
.corner.a{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 12px 0 0;}
.corner.b{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:12px 0 0 0;}
.corner.c{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 12px 0;}
.corner.d{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 12px;}

.cat{position:absolute;top:clamp(10px,1.4vh,18px);right:clamp(12px,1.3vw,22px);z-index:7;
  display:flex;align-items:center;gap:.55em;padding:.42em 1em;border-radius:99px;
  font-size:clamp(12px,1.1vw,20px);font-weight:900;letter-spacing:1px;
  background:rgba(6,10,17,.72);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(7px);}
.cat i{width:.62em;height:.62em;border-radius:50%;background:var(--gold);box-shadow:0 0 9px currentColor;}
.cat.side i{background:var(--sky);box-shadow:0 0 9px var(--sky);}
.cat.int i{background:var(--em);box-shadow:0 0 9px var(--em);}
.cnt{position:absolute;top:clamp(10px,1.4vh,18px);left:clamp(12px,1.3vw,22px);z-index:7;
  padding:.4em .95em;border-radius:99px;background:rgba(6,10,17,.72);border:1px solid rgba(255,255,255,.20);
  backdrop-filter:blur(7px);font-size:clamp(12px,1.05vw,19px);font-weight:900;letter-spacing:2px;direction:ltr;}
.pbadge{position:absolute;bottom:clamp(14px,1.8vh,24px);right:50%;transform:translateX(50%);z-index:7;
  padding:.4em 1.3em;border-radius:99px;background:rgba(6,10,17,.7);border:1px solid rgba(232,188,107,.6);
  backdrop-filter:blur(7px);font-size:clamp(11px,.98vw,17px);font-weight:700;letter-spacing:2px;color:var(--gold2);white-space:nowrap;}
.pbar{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:8;background:rgba(255,255,255,.14);}
.pbar em{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 12px var(--gold);}

/* ---- المعرض المصغّر ---- */
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(4px,.6vw,11px);min-height:0;}
.th{position:relative;aspect-ratio:16/10;min-width:0;border-radius:clamp(6px,.7vw,13px);overflow:hidden;
  cursor:pointer;border:2px solid rgba(255,255,255,.12);opacity:.48;transition:.35s;background:#101a2c;}
.th img{width:100%;height:100%;object-fit:cover;display:block;}
.th .vl{position:absolute;left:0;right:0;bottom:0;text-align:center;
  font-size:clamp(8px,.68vw,12px);font-weight:900;letter-spacing:.4px;padding:1px 0 3px;
  background:linear-gradient(transparent,rgba(4,8,14,.92));color:#eaf2ff;}
.th:hover{opacity:.8;}
.th.on{opacity:1;border-color:var(--gold);transform:translateY(-4px);
  box-shadow:0 12px 26px rgba(0,0,0,.55),0 0 0 2px rgba(232,188,107,.30);}
.th.on .vl{color:var(--gold2);}

/* ---- العمود: البيانات ---- */
.fac{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(5px,1.15vh,15px);}
.tag{color:var(--gold);font-weight:900;letter-spacing:clamp(2px,.3vw,5px);font-size:clamp(12px,1.05vw,19px);
  display:flex;align-items:center;gap:.7em;}
.tag::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(232,188,107,.55),transparent);}
.yr{font-size:clamp(30px,3.1vw,56px);font-weight:900;line-height:.95;letter-spacing:2px;
  background:linear-gradient(160deg,var(--gold2),var(--gold3));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(232,188,107,.20));}
.fac h1{font-size:clamp(32px,4.6vw,84px);font-weight:900;line-height:1.12;letter-spacing:-1px;}
.fac h1 em{font-style:normal;color:var(--gold);}
.desc{font-size:clamp(15px,1.38vw,26px);line-height:1.8;color:var(--soft);font-weight:400;}
.specs{display:flex;flex-wrap:wrap;gap:clamp(5px,.75vh,10px);}
.specs span{display:inline-flex;align-items:center;gap:.5em;
  font-size:clamp(13px,1.12vw,20px);font-weight:700;color:#e4edfb;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  padding:.45em .95em;border-radius:99px;white-space:nowrap;}
.specs span svg{width:1.05em;height:1.05em;fill:var(--gold);flex:none;}

.price{border:1px solid rgba(232,188,107,.34);border-radius:clamp(12px,1.3vw,20px);overflow:hidden;
  background:linear-gradient(165deg,rgba(232,188,107,.12),rgba(255,255,255,.035) 60%,rgba(255,255,255,.02));
  box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(9px);}
.price .r{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:clamp(6px,1.15vh,14px) clamp(11px,1.2vw,22px);
  border-bottom:1px dashed rgba(255,255,255,.16);}
.price .r:last-child{border-bottom:0;}
.price .k{font-size:clamp(13px,1.15vw,20px);font-weight:700;color:#d3e0f2;}
.price .v{display:flex;align-items:center;gap:.4em;font-size:clamp(19px,2.05vw,40px);font-weight:900;
  color:var(--gold2);line-height:1;letter-spacing:-.5px;}
.price .v svg{height:.62em;fill:var(--gold);}
.price .r.hi{background:linear-gradient(90deg,rgba(232,188,107,.20),transparent);}
.price .r.hi .k{color:#fff;}
.save{align-self:flex-start;display:inline-flex;align-items:center;gap:.55em;
  font-size:clamp(12px,1.08vw,19px);font-weight:900;color:#04231c;
  background:linear-gradient(140deg,#8ff5d8,var(--em));padding:.5em 1.05em;border-radius:99px;
  box-shadow:0 10px 24px rgba(62,224,182,.24);}
.save::before{content:'✦';font-size:.9em;}

/* ---- دخول متدرّج ---- */
.sf.on .tag{animation:rise .55s .04s both;}
.sf.on .yr{animation:rise .6s .07s both;}
.sf.on h1{animation:rise .6s .10s both;}
.sf.on .desc{animation:rise .6s .17s both;}
.sf.on .specs{animation:rise .6s .23s both;}
.sf.on .price{animation:rise .6s .30s both;}
.sf.on .save{animation:rise .6s .38s both;}
.sf.on .ci{animation:zoom .7s .02s both;}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}

/* ---- شريحة الإعلان ---- */
.adw{width:min(900px,94%);text-align:center;display:flex;flex-direction:column;align-items:center;
  gap:clamp(6px,1.4vh,18px);}
.orn{height:26px;width:100%;background:url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iMjYiIHZpZXdCb3g9IjAgMCA2NCAyNiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMzIgNEMzMiA0IDI0IDAgMTGgMmM4IDIgMTIgMDE2IDJ6bTAgMGMwIDAgMTIgMCAyMiAyLTgtMi0xNC0yLTIyLTJ6IiBzdHJva2U9IiNlMGI0NjMiIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9zdmc+) repeat-x center/64px 26px;opacity:.95;}
.adw .tg{color:var(--gold);font-weight:900;letter-spacing:clamp(3px,.5vw,8px);font-size:clamp(13px,1.15vw,21px);}
.adw h1{font-size:clamp(34px,5vw,92px);font-weight:900;line-height:1.15;}
.adw h1 em{font-style:normal;color:var(--gold);}
.adw .ds{font-size:clamp(14px,1.35vw,24px);line-height:1.85;color:var(--soft);max-width:640px;}
.cards{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);width:min(560px,90%);margin-top:clamp(4px,1.2vh,14px);}
.card{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:clamp(10px,2vh,22px) clamp(16px,2vw,30px);border-radius:16px;text-decoration:none;color:var(--txt);
  border:2px solid rgba(232,188,107,.55);background:linear-gradient(120deg,rgba(232,188,107,.16),rgba(255,255,255,.03));
  transition:.3s;direction:ltr;}
.card:hover{background:linear-gradient(120deg,rgba(232,188,107,.3),rgba(255,255,255,.05));transform:translateY(-3px);}
.card .num{font-size:clamp(20px,2.3vw,42px);font-weight:900;letter-spacing:.5px;}
.card .meta{display:flex;align-items:center;gap:.6em;font-size:clamp(12px,1.05vw,18px);color:var(--soft);font-weight:700;}
.card .meta img{width:1.35em;height:1.35em;}
.adfoot{color:var(--dim);font-size:clamp(12px,1.1vw,19px);font-weight:700;letter-spacing:.6px;}
.adfoot b{color:var(--gold);font-weight:900;}

/* ============ التذييل ============ */
.ft{position:fixed;left:0;right:0;bottom:0;height:var(--ft);z-index:30;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(0deg,rgba(6,10,17,.94),rgba(6,10,17,.55) 70%,transparent);
  border-top:1px solid rgba(232,188,107,.14);}
.dots{display:flex;gap:clamp(7px,.7vw,13px);}
.dot{width:clamp(9px,.75vw,13px);height:clamp(9px,.75vw,13px);border-radius:99px;
  background:rgba(232,188,107,.32);cursor:pointer;transition:.4s;}
.dot:hover{background:rgba(232,188,107,.75);}

  tSlide+=dt;
  var len=slideLen();
  if(tSlide>=len){go(cur+1);return;}
  if(!DATA[cur].ad){
    var n=shotCount();
    var j=Math.min(n-1,Math.floor(tSlide/SHOT_MS));
    if(j!==imgI)showImg(j);
  }
  paint(tSlide/len);
}

/* ---- تفاعل ---- */
document.addEventListener('click',function(e){
  var th=e.target.closest?e.target.closest('.th'):null;
  if(th){
    var sf=slides()[cur];
    if(DATA[cur].ad)return;
    var j=+th.getAttribute('data-j');
    tSlide=j*SHOT_MS;showImg(j);paint(tSlide/slideLen());
    return;
  }
  var dt=e.target.closest?e.target.closest('.dot'):null;
  if(dt){
    var all=Array.prototype.slice.call(dots.children),i=all.indexOf(dt);
    if(i>-1&&i!==cur)go(i);
    return;
  }
  fs();
});
['touchstart','keydown','pointerdown'].forEach(function(ev){
  document.addEventListener(ev,fs,{once:true,passive:true});
});
function fs(){
  var m=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
  if(m&&!document.fullscreenElement){try{m.call(document.documentElement).catch(function(){});}catch(e){}}
}

/* ---- التشغيل ---- */
function start(){
  buildRail();buildDots();build();
  paintRail();document.getElementById('slNo').textContent=ar(1);
  started=true;last=performance.now();
  setInterval(tick,60);
  paint(0);
  var l=document.getElementById('load');
  l.classList.add('off');setTimeout(function(){l.style.display='none';},700);
}

(function preload(){
  var list=[],n=0;
  DATA.forEach(function(C){if(!C.ad)imgs(C.k).forEach(function(s){list.push(s);});});
  if(!list.length){start();return;}
  var done=function(){if(++n===list.length)start();};
  list.forEach(function(src){var im=new Image();im.onload=im.onerror=done;im.src=src;});
  setTimeout(function(){if(!started)start();},9000);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
